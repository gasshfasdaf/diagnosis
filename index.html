<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Диагностика">
    <meta name="description" content="Чек-лист приёмки автомобилей для диагностов автодилера">

    <title>Диагностика</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

    <!-- ==================== ЭКРАН 1: АВТОРИЗАЦИЯ ==================== -->
    <div id="screen-auth" class="screen active">
        <div class="auth-container">
            <div class="auth-logo">🛡️</div>
            <h1 class="auth-title">Вход в систему</h1>
            <p class="auth-subtitle">Введите корпоративный промокод для доступа к диагностике</p>

            <div class="auth-input-wrap">
                <input type="text" id="promo-input" class="auth-input" placeholder="Промокод" maxlength="20" autocomplete="off">
            </div>

            <button class="btn btn-primary btn-block" onclick="App.login()">Войти</button>

            <p class="auth-hint">Демо-режим: промокод <strong>123</strong></p>
        </div>
    </div>

    <!-- ==================== ЭКРАН 2: СПИСОК КАРТОЧЕК (ТАБЫ) ==================== -->
    <div id="screen-list" class="screen">
        <!-- Шапка -->
        <div class="header sticky">
            <div class="header-top">
                <span class="header-title">Диагностики</span>
                <div class="online-status" id="net-status">
                    <div class="dot"></div> <span>Online</span>
                </div>
            </div>
            <div class="search-row">
                <input type="text" id="search-input" class="search-input" placeholder="Поиск по VIN или модели..." autocomplete="off">
                <button class="btn-icon" onclick="App.goToCreate()" aria-label="Создать карточку">+</button>
            </div>
        </div>

        <!-- Табы -->
        <div class="tabs sticky-tabs">
            <button class="tab active" data-tab="actual" onclick="App.switchTab('actual')">Актуальные</button>
            <button class="tab" data-tab="history" onclick="App.switchTab('history')">История</button>
            <button class="tab" data-tab="archive" onclick="App.switchTab('archive')">Архив</button>
        </div>

        <!-- Контент табов -->
        <div class="content" id="list-content">
            <!-- Карточки рендерятся в JS -->
        </div>
    </div>

    <!-- ==================== ЭКРАН 3: СОЗДАНИЕ КАРТОЧКИ ==================== -->
    <div id="screen-create" class="screen">
        <div class="sheet-header sticky">
            <button class="back-btn" onclick="App.goToList()" aria-label="Назад">←</button>
            <div class="sheet-title-info">
                <h2>Новая карточка</h2>
            </div>
        </div>
        <div class="content">
            <div class="form-group">
                <label>Сотрудник</label>
                <select id="create-employee" class="form-control">
                    <option value="Иванов И.И.">Иванов И.И.</option>
                    <option value="Петров П.П.">Петров П.П.</option>
                    <option value="Сидоров С.С.">Сидоров С.С.</option>
                </select>
            </div>
            <div class="form-group">
                <label>Марка</label>
                <input type="text" id="create-make" class="form-control" placeholder="Например: Mazda" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Модель</label>
                <input type="text" id="create-model" class="form-control" placeholder="Например: CX-5" autocomplete="off">
            </div>
            <div class="form-group">
                <label>VIN</label>
                <input type="text" id="create-vin" class="form-control" placeholder="17-значный код" maxlength="17" autocomplete="off">
            </div>
            <button class="btn btn-primary btn-block" onclick="App.createSheet()">Начать работу</button>
        </div>
    </div>

    <!-- ==================== ЭКРАН 4: ДЕТАЛИ КАРТОЧКИ (ВЫБОР СОСТОЯНИЯ) ==================== -->
    <div id="screen-details" class="screen">
        <div class="sheet-header sticky">
            <button class="back-btn" onclick="App.goToList()" aria-label="Назад">←</button>
            <div class="sheet-title-info">
                <h2 id="details-title">Mazda CX-5</h2>
                <p id="details-subtitle">—</p>
            </div>
        </div>
        <div class="content" id="details-content">
            <!-- Итерации рендерятся в JS -->
        </div>
    </div>

    <!-- ==================== ЭКРАН 5: ЧЕК-ЛИСТ ==================== -->
    <div id="screen-checklist" class="screen">
        <div class="sheet-header sticky">
            <button class="back-btn" onclick="App.goBackFromChecklist()" aria-label="Назад">←</button>
            <div class="sheet-title-info">
                <h2 id="chk-title">Mazda CX-5</h2>
                <p id="chk-subtitle">—</p>
            </div>
            <button class="back-btn" onclick="App.showPdfOptions()" aria-label="PDF">📄</button>
        </div>
        <div class="content" id="checklist-content">
            <!-- Группы рендерятся в JS -->
        </div>
        <div class="bottom-bar" id="checklist-bottom-bar">
            <button class="btn btn-primary btn-block" onclick="App.finishIteration()">Завершил</button>
        </div>
    </div>

    <!-- ==================== ЭКРАН 6: АУДИТ-ЛОГ ==================== -->
    <div id="screen-audit" class="screen">
        <div class="sheet-header sticky">
            <button class="back-btn" onclick="App.goBackFromAudit()" aria-label="Назад">←</button>
            <div class="sheet-title-info">
                <h2>История изменений</h2>
                <p id="audit-subtitle">—</p>
            </div>
        </div>
        <div class="content" id="audit-content">
            <!-- Записи рендерятся в JS -->
        </div>
    </div>

    <!-- ==================== ЭКРАН 7: PDF (печать) ==================== -->
    <div id="screen-pdf" class="screen">
        <div class="sheet-header sticky no-print">
            <button class="back-btn" onclick="App.goBackFromPdf()" aria-label="Назад">←</button>
            <div class="sheet-title-info">
                <h2>PDF</h2>
                <p id="pdf-subtitle">—</p>
            </div>
            <button class="back-btn" onclick="App.printPdf()" aria-label="Печать">🖨️</button>
        </div>
        <div class="content pdf-content" id="pdf-content">
            <!-- Содержимое PDF рендерится в JS -->
        </div>
    </div>

    <!-- ==================== ДЕБАГ-ПАНЕЛЬ ==================== -->
    <div id="debug-panel" class="debug-panel">
        <button class="debug-fab" onclick="App.toggleDebug()" aria-label="Меню">⚙️</button>
        <div class="debug-menu" id="debug-menu">
            <button onclick="App.simulateCron()">⏩ +7 дней (CRON)</button>
            <button onclick="App.demoPush()">🔔 Демо-пуш</button>
            <button onclick="App.showAudit()">📋 Аудит-лог</button>
            <button onclick="App.resetData()" style="color: var(--danger);">🗑️ Сбросить данные</button>
        </div>
    </div>

    <!-- ==================== ТОСТ ==================== -->
    <div id="toast" class="toast"></div>

    <!-- ==================== МОДАЛЬНОЕ ОКНО (универсальное) ==================== -->
    <div id="modal" class="modal-overlay" onclick="App.closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="assets/app.js"></script>
</body>
</html>
